name: Actualizar Parlamento 2026

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencia XLSX desde npm público
        run: |
          npm install xlsx@0.18.5 --no-save --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org/
          node -e "import('xlsx').then(() => console.log('xlsx instalado correctamente'))"

      - name: Actualizar JSON parlamentario
        run: npm run update:parlamento

      - name: Guardar cambios si hubo actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parlamento-2026.json data/diagnostico-aklla.json
          git diff --cached --quiet || git commit -m "Actualizar datos parlamentarios"
          git push
