name: Actualizar Parlamento 2026

on:
  workflow_dispatch:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generar JSON parlamentario
        run: npm run update:parlamento:dapper
        env:
          DAPPER_BASE_URL: https://elecciones2026.dapperglobal.com

      - name: Guardar cambios si hubo actualizacion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parlamento-2026.json data/diagnostico-dapper.json
          git diff --cached --quiet || git commit -m "Actualizar datos parlamentarios"
          git push
