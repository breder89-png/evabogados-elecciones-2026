name: Actualizar Parlamento 2026

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar JSON parlamentario
        run: npm run update:parlamento:dapper
        env:
          DAPPER_BASE_URL: https://elecciones2026.dapperglobal.com

      - name: Guardar cambios si hubo actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parlamento-2026.json data/diagnostico-dapper.json
          git diff --cached --quiet || git commit -m "Actualizar datos parlamentarios"
          git push
