name: Actualizar Parlamento EG2026

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Generar JSON parlamentario
        run: npm run update:parlamento
        env:
          AKLLA_BASE_URL: https://congresoeg2026.akllaperu.pe
      - name: Commit JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parlamento-2026.json
          git diff --cached --quiet || git commit -m "Actualizar JSON parlamentario EG2026"
          git push
